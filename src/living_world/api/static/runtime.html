<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local World Runtime</title><link rel="stylesheet" href="/runtime/assets/runtime.css"><script defer src="/runtime/assets/runtime.js"></script></head>
<body><main><h1>Local World Runtime</h1>
<form id="login"><label for="token">Administrator token</label><input id="token" type="password" autocomplete="off" spellcheck="false" required><button>Connect</button></form>
<button id="disconnect" hidden>Disconnect</button><p id="notice" role="status" aria-live="polite">Connect to inspect saved worlds and control the current run.</p>
<div id="session" hidden><section><h2>Current run</h2><p id="freshness" role="status"></p><pre id="live"></pre><button id="return-live">Return to live</button><div id="controls" aria-label="Run controls"></div><div id="receipts" aria-live="polite"></div></section>
<section><h2>Saved attempts</h2><button id="refresh-archives">Refresh archives</button><p id="archive-status" role="status"></p><div class="overflow"><table><thead><tr><th>Attempt</th><th>Mode / scenario</th><th>Started</th><th>Parent</th><th>Last committed tick</th><th>Lifecycle</th><th>Outcome</th></tr></thead><tbody id="archives"></tbody></table></div></section>
<section id="details-panel" hidden><h2>Saved attempt details</h2><pre id="details"></pre><h3>Configuration</h3><pre id="configuration"></pre><h3>Journal</h3><pre id="journal"></pre><label for="checkpoint">Complete checkpoint</label><select id="checkpoint"><option value="">Choose a checkpoint</option></select></section>
<section><h2>World preview</h2><p id="source" role="status"></p><div id="preview"></div></section></div>
</main></body></html>
