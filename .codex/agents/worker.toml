process requires one. It should state:
1. Files changed.
2. Behavioral change.
3. Invariants affected.
4. Tests/checks run and exact results.
5. Known limitations or deviations.
6. Anything the orchestrator/reviewer should inspect carefully.

Do not approve, merge, or broaden your own work.
"""
