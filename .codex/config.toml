# Project-local Codex role definitions for Living World Simulator.
# Personal model/reasoning/approval/sandbox defaults live in ~/.codex/config.toml.

[agents.explorer]
description = "Read-only, narrowly scoped repository investigator."
config_file = ".codex/agents/explorer.toml"

[agents.worker]
description = "Implements one decision-complete, explicitly authorized bounded task."
config_file = ".codex/agents/worker.toml"

[agents.reviewer]
description = "Independent read-only reviewer of task-contract compliance and repository invariants."
config_file = ".codex/agents/reviewer.toml"
