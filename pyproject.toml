[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"

[project]
name="living-world-simulator"
version="0.2.3"
description="Event-driven simulation engine."
requires-python=">=3.11"
dependencies=["fastapi"]

[project.optional-dependencies]
dev=["pytest","ruff","black","uvicorn"]

[tool.setuptools]
package-dir={""="src"}

[tool.setuptools.packages.find]
where=["src"]

[tool.ruff]
line-length=88

[tool.black]
line-length = 88
target-version = ["py311"]
