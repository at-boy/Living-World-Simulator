[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "living-world-simulator"
version = "0.1.1"
description = "Event-driven simulation engine for persistent worlds."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "uvicorn",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
