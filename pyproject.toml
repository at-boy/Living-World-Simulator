[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"

[project]
name="living-world-simulator"
version="0.6.0rc1"
description="Event-driven simulation engine."
requires-python=">=3.11"
dependencies=["fastapi", "PyYAML"]

[project.scripts]
living-world="living_world.cli:main"

[project.optional-dependencies]
server=["uvicorn"]
browser-tests=["playwright"]
dev=["pytest","ruff","black","uvicorn"]

[tool.setuptools]
package-dir={""="src"}

[tool.setuptools.packages.find]
where=["src"]

[tool.ruff]
line-length=88

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.setuptools.package-data]
"living_world.founders"=["assets/founders.yaml", "assets/definitions.yaml", "assets/success.yaml", "assets/stall.yaml", "assets/failure.yaml"]
"living_world.api"=["static/inspector.html", "static/inspector.css", "static/inspector.js"]
